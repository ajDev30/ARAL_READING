version: '3.8'

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8011:8011"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - speech-service

  web:
    build: 
      context: .
      dockerfile: Dockerfile.php
    environment:
      - DB_HOST=db
      - DB_NAME=aral_reading_db
      - DB_USER=andrew
      - DB_PASS=1234
    depends_on:
      - db
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./v536/.env:/var/www/html/v536/.env

  speech-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./v536/.env:/app/v536/.env

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aral_reading_db
      MYSQL_USER: andrew
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "3306:3306"

volumes:
  db_data:
  caddy_data:
  caddy_config:
